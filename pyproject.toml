[project]
name = "athena-development"
version = "0.0.0"
description = "Development tooling for the Athena plugin distribution."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "check-jsonschema>=0.38.0,<1",
    "coverage>=7.15.4,<8",
    "mypy>=2.3.0,<3",
    "pre-commit>=4.6.1,<5",
    "pytest>=9.0.3,<10",
    "pymarkdownlnt>=0.9.39,<1",
    "pyyaml>=6.0,<7",
    "ruff>=0.16.2,<1",
    "types-pyyaml>=6.0.12.20260724,<7",
    "yamllint>=1.35,<2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
