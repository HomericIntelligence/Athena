# This configuration identifies paths that the HomericIntelligence marketplace
# scanner must ignore in the Athena working tree.
#
# The configuration contains a subset of `.gitignore` and scanner-specific paths.
# The scanner searches the repository for plugin.json and marketplace.json.
# These exclusions prevent false results from build artifacts and dependencies.

[scanner]
ignore_paths = [
  # Ignore version-control data.
  ".git/",

  # Ignore build and distribution output.
  "dist/",

  # Ignore Python caches.
  "__pycache__/",
  ".venv/",

  # Ignore integrated development environment and operating-system files.
  ".idea/",
  ".vscode/",
  ".DS_Store",

  # Ignore secret files as an additional security control. Never commit secrets.
  ".env",
  ".env.*",
  "secrets/",

  # Ignore internal iteration artifacts.
  "scripts/_local/",
  "tests/_local/",
]
