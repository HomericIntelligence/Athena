repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: local
    hooks:
      - id: athena-validate-skills
        name: Validate the Athena plugin distribution
        entry: just validate
        language: system
        pass_filenames: false
      - id: athena-markdownlint
        name: Check Markdown in the Athena repository
        entry: just markdownlint
        language: system
        pass_filenames: false
      - id: athena-validator-tests
        name: Run the Athena contract tests and coverage policy
        entry: just test
        language: system
        pass_filenames: false
      - id: athena-python-lint
        name: Check the Athena repository tools
        entry: just lint
        language: system
        pass_filenames: false
      - id: athena-python-format
        name: Check the format of the Athena repository tools
        entry: just format-check
        language: system
        pass_filenames: false
      - id: athena-python-types
        name: Check the types in the Athena repository tools
        entry: just typecheck
        language: system
        pass_filenames: false
