# Configure Dependabot with the HomericIntelligence fleet baseline.
# Dependabot checks for updates each month.
# For each package ecosystem, it puts minor and patch updates in one pull request.
# It puts major updates in a different pull request for that ecosystem.

version: 2
updates:
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: 'npm'
    directory: '/ci/pi-runtime'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: 'chore(ci)'
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major:
        patterns:
          - "*"
        update-types:
          - "major"
