name: Release

"on":
  push:
    tags: ["v*", "agent-contract-v*"]

permissions:
  contents: read

jobs:
  agent-contract:
    name: agent-contract
    permissions:
      contents: read
    uses: $/.github/workflows/_agent-contract.yml

  preflight:
    name: verify-release-trust
    needs: agent-contract
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release environment configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py release-environment
      - name: Verify the signed tag and its ancestry from protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py release

  required:
    name: required-checks
    needs: agent-contract
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/_required.yml
    with:
      full-tests: true

  release:
    name: release
    needs: [preflight, required]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: athena-plugin
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py publish-release --root dist

  publish-npm:
    name: publish-npm
    needs: [preflight, required]
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Stage the opencode npm package
        run: python scripts/package_opencode.py --output dist/opencode-npm
      # A published package that OpenCode cannot load stays broken in every
      # cached install. This gate stops the release before that can happen.
      - name: Verify the staged opencode package exports a loadable plugin definition
        run: |
          node --input-type=module -e "
            import('./dist/opencode-npm/plugin.js').then((module) => {
              const plugin = module.default;
              const ok = plugin
                && plugin.id === '@homericintelligence/athena-opencode'
                && typeof plugin.setup === 'function';
              if (!ok) {
                console.error('The staged package is not a loadable opencode plugin.');
                process.exit(1);
              }
              console.log('The staged opencode package is loadable.');
            });"
      # The 0.4.4 and 0.5.x artifacts cannot load on OpenCode 2. Automation cannot
      # be trusted to deprecate them, so a maintainer must deprecate them once:
      #   npm deprecate '@homericintelligence/athena-opencode@<0.6.0' \
      #     'Cannot load on OpenCode 2; use 0.7.0 or later'
      # This gate blocks the release until that one-time action is done.
      - name: Verify the known-broken published versions are deprecated
        run: |
          deprecated="$(npm view '@homericintelligence/athena-opencode@<0.6.0' \
            deprecated)"
          if [ -z "$deprecated" ]; then
            echo "::error::The published 0.4.x and 0.5.x packages cannot load."
            echo "::error::They are not deprecated. Run: npm deprecate" \
              "'@homericintelligence/athena-opencode@<0.6.0'" \
              "'Cannot load on OpenCode 2; use 0.7.0 or later'"
            exit 1
          fi
          echo 'The known-broken published versions are deprecated.'
      - name: Publish npm package
        run: npm publish ./dist/opencode-npm --access public --provenance

  agent-contract-release:
    name: verify-agent-contract-release
    needs: required
    if: startsWith(github.ref_name, 'agent-contract-v')
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify live agent-contract tag protection
        env:
          GH_TOKEN: ${{ secrets.AGENT_CONTRACT_RULESET_PROOF_TOKEN }}
        run: python scripts/ci_policy.py agent-contract-live-ruleset
      - name: Bind the annotated tag to its commit
        run: printf 'AGENT_CONTRACT_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify the signed agent-contract tag and release evidence
        env:
          AGENT_CONTRACT_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py agent-contract-release
      - name: Verify tagged principle URLs
        env:
          AGENT_CONTRACT_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py agent-contract-url-resolution
