name: Release

"on":
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  agent-contract:
    name: agent-contract
    permissions:
      contents: read
    uses: $/.github/workflows/_agent-contract.yml

  preflight:
    name: verify-release-trust
    needs: agent-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release environment configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py release-environment
      - name: Verify the signed tag and its ancestry from protected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py release

  required:
    name: required-checks
    needs: preflight
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/_required.yml

  release:
    name: release
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: athena-plugin
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_policy.py publish-release --root dist

  publish-npm:
    name: publish-npm
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Stage the opencode npm package
        run: python scripts/package_opencode.py --output dist/opencode-npm
      - name: Publish npm package
        run: npm publish ./dist/opencode-npm --access public --provenance
