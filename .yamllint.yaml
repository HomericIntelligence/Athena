---
# This yamllint configuration uses the Hephaestus defaults.
extends: default

rules:
  line-length:
    max: 100
    level: warning
  document-start:
    present: false  # YAML files do not require the '---' document-start marker.
  truthy:
    level: warning
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
